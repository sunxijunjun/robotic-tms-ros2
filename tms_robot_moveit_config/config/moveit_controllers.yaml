# MoveIt uses this configuration for controller management

# ponytail: scaled_joint_trajectory_controller runs slower than planned time when the
# UR pendant speed slider is below 100%; allow up to ~10x before declaring TIMED_OUT.
trajectory_execution:
  allowed_execution_duration_scaling: 10.0
  allowed_goal_duration_margin: 5.0
  allowed_start_tolerance: 0.01

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - scaled_joint_trajectory_controller

  scaled_joint_trajectory_controller:
    type: FollowJointTrajectory
    joints:
      - ur10e_shoulder_pan_joint
      - ur10e_shoulder_lift_joint
      - ur10e_elbow_joint
      - ur10e_wrist_1_joint
      - ur10e_wrist_2_joint
      - ur10e_wrist_3_joint
    action_ns: follow_joint_trajectory
    default: true